<svg width="520" height="100" viewBox="0 0 520 100" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Makao — The Agency Platform</title>
  <desc>Makao full logotype lockup with icon, wordmark, and tagline.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@500&display=swap');
    </style>
  </defs>

  <!-- Icon -->
  <rect x="0" y="0" width="80" height="80" rx="18" fill="#141414"/>
  <path d="M 13 62 L 13 36 Q 13 14 34 14 Q 55 14 55 36 L 55 62" fill="none" stroke="#C9A96E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 55 62 L 55 36 Q 55 14 76 14 Q 97 14 97 36 L 97 62" fill="none" stroke="#C9A96E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44" y="44" width="14" height="20" rx="7" fill="#C9A96E"/>
  <line x1="6" y1="62" x2="80" y2="62" stroke="#C9A96E" stroke-width="3" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="100" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="600" letter-spacing="8" fill="#141414">MAKAO</text>

  <!-- Tagline -->
  <text x="101" y="72" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="5" fill="#999999">THE AGENCY PLATFORM</text>

</svg>
